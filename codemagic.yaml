workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.kok.realview
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - kok_env
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"

      - name: Create .env file
        script: |
          cat > "$CM_BUILD_DIR/.env" << 'ENVEOF'
          SUPABASE_URL=https://lwetcjkgspurlhyfufbz.supabase.co
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          GEMINI_API_KEY=$GEMINI_API_KEY
          GROQ_API_KEY=$GROQ_API_KEY
          NAVER_CLIENT_ID=$NAVER_CLIENT_ID
          NAVER_CLIENT_SECRET=$NAVER_CLIENT_SECRET
          YOUTUBE_API_KEY=$YOUTUBE_API_KEY
          ENVEOF

      - name: Install dependencies
        script: |
          flutter packages pub get

      - name: Install CocoaPods
        script: |
          cd ios && pod install

      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" || echo 0) + 1)) \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
